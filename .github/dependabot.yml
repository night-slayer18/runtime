version: 2

# Keep Go modules and GitHub Actions up to date. Each Go module has its own
# go.mod, so each gets its own gomod entry. Each entry groups its updates into
# a single PR per module (minor/patch together) so a weekly run produces a
# handful of reviewable PRs rather than one per dependency across 17 modules.
updates:
  # ---- Applications ----
  - package-ecosystem: gomod
    directory: /apps/grid
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(grid)"
    groups:
      grid:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /apps/prism
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(prism)"
    groups:
      prism:
        patterns: ["*"]

