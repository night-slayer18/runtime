version: 2

updates:
  # ---- Applications ----
  - package-ecosystem: gomod
    directory: /apps/grid
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
    groups:
      all-go-deps:
        patterns: ["*"]

