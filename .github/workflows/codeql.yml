name: CodeQL

# CodeQL static analysis for Go, in its own workflow so it can be managed
# independently of the per-module security checks in security.yml.
#
# Build mode is "none": CodeQL's Go extractor analyzes the source directly
# without compiling it. This is the robust choice for this repository because
# it is a multi-module go.work workspace (the repo root is not a single Go
# module), so there is no one build command CodeQL could trace. "none" avoids
# the fragility of manual build tracing across 17 modules.
#
# NOTE: If GitHub "default" code scanning is ever enabled for this repo in the
# Security settings, disable it before relying on this advanced workflow —
# GitHub rejects an advanced CodeQL workflow while default setup is active.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:30 UTC (offset from security.yml to spread scheduled load).
    - cron: "30 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"
