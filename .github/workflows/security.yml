name: Security

# Vulnerability + supply-chain checks on pushes, PRs, and a weekly schedule.
#   - govulncheck per module (golang.org/x/vuln)
#   - go mod verify per module (verifies module cache integrity)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"

jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          set -euo pipefail
          modules=$(find apps packages -maxdepth 2 -name go.mod -exec dirname {} \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  govulncheck:
    name: govulncheck ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  mod-verify:
    name: go mod verify ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go mod verify
        working-directory: ${{ matrix.module }}
        run: go mod verify
